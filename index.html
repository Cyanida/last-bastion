<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + env(safe-area-inset-*) in the CSS keep the HUD out from under the notch and home indicator -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Last Bastion</title>
    <meta name="description" content="Medieval wave-survival: five classes, relics, squads, bosses. Plays in the browser, on iPhone and on Windows." />
    <meta name="theme-color" content="#14110f" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Last Bastion" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@600;700&family=IM+Fell+English:ital@0;1&family=UnifrakturCook:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud" class="hidden"></div>
    <div id="overlay" class="hidden"></div>
    <pre id="perf" class="hidden"></pre>
    <div id="rotate"><div><span>⟳</span>Rotate your device<small>Last Bastion plays in landscape</small></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
