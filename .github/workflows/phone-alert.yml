name: Phone alert

# A push to Jesse's phone through ntfy (https://ntfy.sh) for what needs him: a new pull request, a question for him, a handoff from the
# routine. GitHub doesn't notify him about what the routine posts under his own account. The ntfy topic lives in the NTFY_TOPIC secret.
# pull_request_target runs this file from main, never code from the pull request, and titles reach the script only through env.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled]
  issues:
    types: [labeled]
  workflow_dispatch:

permissions: {}

jobs:
  alert:
    runs-on: ubuntu-latest
    if: >-
      github.event.action == 'labeled' && (github.event.label.name == 'question-for-jesse' || github.event.label.name == 'handoff') ||
      github.event.action != 'labeled' && !github.event.pull_request.draft
    steps:
      - env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          LABEL: ${{ github.event.label.name }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          URL: ${{ github.event.pull_request.html_url || github.event.issue.html_url }}
        run: |
          [ -n "$TOPIC" ] || { echo "No NTFY_TOPIC secret: nothing sent"; exit 0; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then head='Test'; TITLE='Phone alerts work'; URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          elif [ -n "$LABEL" ]; then head="$LABEL on #$NUMBER"
          else head="pull request #$NUMBER by $AUTHOR"; fi
          jq -n --arg topic "$TOPIC" --arg title "Last Bastion: $head" --arg message "$TITLE" --arg click "$URL" \
            '{topic: $topic, title: $title, message: $message, click: $click}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @- https://ntfy.sh/ > /dev/null
