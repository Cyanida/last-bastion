name: CI

# Every pull request and every push to main: type check, unit tests and a build. `main` requires this check (CONTRIBUTING.md).
on:
  push:
    branches: [main, 'release/**', 'patch/**'] # release branches are checked on every push: work reaches main only as a whole release
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
