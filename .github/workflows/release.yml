name: Release (Windows installer)

# A pushed tag v* builds the NSIS installer and publishes it, its blockmap and latest.yml to a GitHub Release.
# electron-updater in the installed app reads latest.yml from there. Tags with a suffix (v0.3.0-beta.1) become pre-releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then echo "tag $TAG does not match package.json $VERSION"; exit 1; fi
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Create the GitHub release
        # Created here, not by electron-builder: its two publishers (installer + update metadata) race to create it
        # and the loser's uploads are dropped.
        run: |
          if [[ "$TAG" == *-* ]]; then KIND="--prerelease"; else KIND="--latest"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Last Bastion $TAG" --generate-notes $KIND
      - name: Build installer and publish
        # Code signing would go here: CSC_LINK (base64 .pfx) and CSC_KEY_PASSWORD from repository secrets.
        run: |
          if [[ "$TAG" == *-* ]]; then export EP_PRE_RELEASE=true; fi
          npx electron-builder --win --publish always
          ls -la release
      - name: Make sure the updater has everything it needs
        run: |
          gh release upload "$TAG" release/*.exe release/*.blockmap release/latest*.yml --clobber
          gh release edit "$TAG" --draft=false # a stale draft for this tag must not swallow the release
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee assets.txt
          grep -q 'Setup-.*\.exe$' assets.txt && grep -q '^latest\.yml$' assets.txt
      - name: The published latest.yml, installer and version match the tag
        # v0.7: installed copies update from the published latest.yml; if it names another version or file, fail here, not on players' machines
        run: |
          V="${TAG#v}"
          EXE="last-bastion-Setup-$V.exe"
          gh release download "$TAG" -p latest.yml -O published.yml --clobber
          cat published.yml
          fail() { echo "::error::$1"; exit 1; }
          [ "$(node -p "require('./package.json').version")" = "$V" ] || fail "package.json is not $V"
          grep -qx "version: $V" published.yml || fail "latest.yml version is not $V"
          grep -qx "path: $EXE" published.yml || fail "latest.yml path is not $EXE"
          grep -qx "  - url: $EXE" published.yml || fail "latest.yml url is not $EXE"
          grep -qx "$EXE" assets.txt || fail "the release has no $EXE"
          SIZE=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name==\"$EXE\") | .size")
          grep -qx "    size: $SIZE" published.yml || fail "latest.yml size is not the published installer's ($SIZE)"
          SHA=$(node -e "process.stdout.write(require('crypto').createHash('sha512').update(require('fs').readFileSync(process.argv[1])).digest('base64'))" "release/$EXE")
          grep -qx "sha512: $SHA" published.yml || fail "latest.yml sha512 is not the built installer's"
          echo "latest.yml, $EXE and $V match $TAG"
