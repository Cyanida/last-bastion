name: Idea
description: A feature, a change, or something that would make the game better.
labels: ['type:feature']
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should change, and what it would feel like in play.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem it solves or what it adds. Examples from other games help.
  - type: dropdown
    id: size
    attributes:
      label: How big do you think it is
      options:
        - A tweak (numbers, text, a small rule)
        - A feature (a new mechanic or screen)
        - A system (something that touches much of the game)
